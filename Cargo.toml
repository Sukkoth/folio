[package]
name = "folio"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
lru = "0.19.0"
mupdf = "0.8.0"
rfd = "0.17.2"
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

