[package]
name = "folio"
version = "0.0.1"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.17"
lru = "0.19.0"
mupdf = "0.8.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
arboard = "3.4"
slint = { version = "1.18.1", default-features = true, features = ["backend-winit-wayland"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

